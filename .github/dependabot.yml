# Automated dependency updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # pnpm workspace (root, apps/*, packages/*, packages/adapters/*).
  # Dependabot reads pnpm-workspace.yaml and updates pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Framework packages that must move together.
      next-react:
        patterns:
          - next
          - eslint-config-next
          - "@next/*"
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Everything else that is not a major bump lands in one PR.
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # Major bumps still open one PR per package so they can be reviewed individually.

  # Go modules. Chain-coupled modules (Cosmos SDK, CometBFT, IBC, EVM and the
  # xrplevm forks wired through `replace`) must track the XRPL EVM node version,
  # so they are upgraded by hand rather than by Dependabot.
  - package-ecosystem: gomod
    directories:
      - /apps/callisto
      - /packages/juno
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: github.com/cosmos/cosmos-sdk
      - dependency-name: cosmossdk.io/*
      - dependency-name: github.com/cometbft/*
      - dependency-name: github.com/cosmos/ibc-go/*
      - dependency-name: github.com/cosmos/evm
      - dependency-name: github.com/xrplevm/*
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI/CD workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images for the release Dockerfiles built in CI.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Node major upgrades must stay in sync with the Node version used in CI.
      - dependency-name: node
        update-types:
          - version-update:semver-major
